{% extends 'base.html' %}{% block content %}<header class="page-header"><h1>Regras dos relatórios</h1><a href="/operacoes-internas/relatorios">Voltar ao histórico</a></header><section class="panel"><form method="post" class="form-stack"><label>Primeiro dia da semana<select name="week_start">{% for label in ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'] %}<option value="{{ loop.index0 }}" {{ 'selected' if settings.week_start==loop.index0 }}>{{ label }}</option>{% endfor %}</select></label><label><input type="checkbox" name="allow_partial" {{ 'checked' if settings.allow_partial }}> Permitir submissão com fontes incompletas, mediante justificação</label><p class="muted">Os períodos já arquivados mantêm as datas e regras usadas na sua geração.</p><button>Guardar regras</button></form></section>{% endblock %}
